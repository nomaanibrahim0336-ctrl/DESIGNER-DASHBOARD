<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0F; font-family: 'DM Sans', sans-serif; padding: 20px; }
  .section { background: #141418; border: 1px solid #2A2A35; border-radius: 10px; padding: 16px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 6px 0; }
  .row:not(:last-child) { border-bottom: 1px solid #1F1F28; }
  .usage { font-size: 10px; color: #55556A; min-width: 130px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <div class="section">
    <div class="row"><div class="usage">Order / Tracking ID</div><div class="mono" style="font-size:12px;color:#7C6AF7;">#ORD-7841 · TCS-88291</div></div>
    <div class="row"><div class="usage">SKU / Product Code</div><div class="mono" style="font-size:12px;color:#F0EFF6;">NK-AM270-BLK</div></div>
    <div class="row"><div class="usage">Keyboard Shortcut</div><div style="display:flex;gap:4px;"><span style="background:#1C1C22;border:1px solid #2A2A35;border-radius:4px;padding:2px 6px;font-size:11px;color:#55556A;font-family:'JetBrains Mono',monospace;">⌘K</span><span style="background:#1C1C22;border:1px solid #2A2A35;border-radius:4px;padding:2px 6px;font-size:11px;color:#55556A;font-family:'JetBrains Mono',monospace;">ESC</span></div></div>
    <div class="row"><div class="usage">Timestamp (table)</div><div class="mono" style="font-size:11px;color:#55556A;">2024-12-04 10:32</div></div>
  </div>
</body>
</html>
