<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0F; font-family: 'DM Sans', sans-serif; padding: 20px; }
  .row { display: flex; gap: 10px; align-items: stretch; margin-bottom: 12px; }
  .block { border-radius: 10px; overflow: hidden; border: 1px solid #2A2A35; }
  .color-area { display: flex; align-items: center; justify-content: center; }
  .pad { padding: 10px 12px; background: #141418; }
  .label { font-size: 11px; font-weight: 600; color: #F0EFF6; }
  .hex { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #55556A; margin-top: 2px; }
  .var { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7C6AF7; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="block" style="flex:2"><div class="color-area" style="background:linear-gradient(135deg,#7C6AF7,#9180FF);height:72px;"><span style="font-size:20px;font-weight:800;color:white;">Aa</span></div><div class="pad"><div class="label">Accent</div><div class="hex">#7C6AF7</div><div class="var">--accent</div></div></div>
    <div class="block" style="flex:1"><div class="color-area" style="background:#9180FF;height:72px;"></div><div class="pad"><div class="label">Hover</div><div class="hex">#9180FF</div><div class="var">--accent-hover</div></div></div>
    <div class="block" style="flex:1"><div class="color-area" style="background:#2A2550;height:72px;"></div><div class="pad"><div class="label">Muted</div><div class="hex">#2A2550</div><div class="var">--accent-muted</div></div></div>
  </div>
  <div class="row" style="gap:8px;margin-bottom:0;">
    <div style="display:flex;align-items:center;justify-content:center;padding:8px 16px;background:#7C6AF7;border-radius:8px;font-size:13px;font-weight:500;color:#fff;">Button</div>
    <div style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#2A2550;color:#7C6AF7;border:1px solid #7C6AF733;">Processing</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#7C6AF7;padding:4px 0;">#ORD-7841</div>
    <div style="font-size:10px;font-weight:600;padding:2px 6px;background:#2A2550;color:#7C6AF7;border-radius:4px;border:1px solid #7C6AF733;">PRO</div>
  </div>
</body>
</html>
