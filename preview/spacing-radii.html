<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0F; font-family: 'DM Sans', sans-serif; padding: 20px; }
  .grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 52px; height: 36px; background: #141418; border: 1px solid #2A2A35; }
  .val { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7C6AF7; }
  .name { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #55556A; }
  .shadow-row { display: flex; gap: 16px; align-items: center; }
  .shadow-demo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .s-box { width: 100px; height: 44px; background: #141418; border: 1px solid #2A2A35; }
  .s-label { font-size: 10px; color: #55556A; font-family: 'JetBrains Mono', monospace; text-align: center; }
</style>
</head>
<body>
  <div class="grid">
    <div class="chip"><div class="box" style="border-radius:3px;"></div><div class="val">3px</div><div class="name">--radius-xs</div></div>
    <div class="chip"><div class="box" style="border-radius:4px;"></div><div class="val">4px</div><div class="name">--radius-sm</div></div>
    <div class="chip"><div class="box" style="border-radius:6px;"></div><div class="val">6px</div><div class="name">--radius-md</div></div>
    <div class="chip"><div class="box" style="border-radius:8px;"></div><div class="val">8px</div><div class="name">--radius-lg</div></div>
    <div class="chip"><div class="box" style="border-radius:12px;"></div><div class="val">12px</div><div class="name">--radius-xl</div></div>
    <div class="chip"><div class="box" style="border-radius:14px;"></div><div class="val">14px</div><div class="name">--radius-2xl</div></div>
    <div class="chip"><div class="box" style="border-radius:999px;"></div><div class="val">999px</div><div class="name">--radius-full</div></div>
  </div>
  <div class="shadow-row">
    <div class="shadow-demo"><div class="s-box" style="border-radius:12px;"></div><div class="s-label">Card — border only</div></div>
    <div class="shadow-demo"><div class="s-box" style="border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.5);"></div><div class="s-label">Dropdown shadow</div></div>
    <div class="shadow-demo"><div class="s-box" style="border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.7);"></div><div class="s-label">Modal shadow</div></div>
  </div>
</body>
</html>
