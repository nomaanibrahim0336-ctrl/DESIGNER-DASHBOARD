<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0F; font-family: 'DM Sans', sans-serif; padding: 28px 32px; display: flex; align-items: center; gap: 40px; }
  .divider { width: 1px; height: 60px; background: #2A2A35; }
</style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:8px;">
    <div style="width:28px;height:28px;background:linear-gradient(135deg,#7C6AF7,#9180FF);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;">C</div>
    <span style="font-weight:700;font-size:16px;color:#F0EFF6;">CRM</span>
    <span style="font-size:10px;font-weight:600;padding:2px 6px;background:#2A2550;color:#7C6AF7;border-radius:4px;border:1px solid #7C6AF733;">PRO</span>
  </div>
  <div class="divider"></div>
  <div style="display:flex;gap:10px;align-items:center;">
    <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7C6AF7,#3A8AE8);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;">N</div>
    <div style="width:26px;height:26px;border-radius:50%;background:#2A2550;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#7C6AF7;">AM</div>
    <div style="font-size:11px;color:#55556A;max-width:100px;">Avatar: gradient circle with initials</div>
  </div>
</body>
</html>
