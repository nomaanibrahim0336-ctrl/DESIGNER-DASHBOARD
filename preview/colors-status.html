<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0F; font-family: 'DM Sans', sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 12px; }
  .card { border-radius: 10px; overflow: hidden; border: 1px solid #2A2A35; }
  .top { height: 48px; }
  .bot { padding: 8px 10px; background: #141418; }
  .name { font-size: 11px; font-weight: 600; color: #F0EFF6; }
  .hex { font-family: 'Courier New', monospace; font-size: 10px; color: #55556A; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card"><div class="top" style="background:#1DB87A"></div><div class="bot"><div class="name">Green</div><div class="hex">#1DB87A / #0F3D2A</div></div></div>
    <div class="card"><div class="top" style="background:#F5A623"></div><div class="bot"><div class="name">Amber</div><div class="hex">#F5A623 / #3D2D0A</div></div></div>
    <div class="card"><div class="top" style="background:#E2514A"></div><div class="bot"><div class="name">Red</div><div class="hex">#E2514A / #3D1414</div></div></div>
    <div class="card"><div class="top" style="background:#3A8AE8"></div><div class="bot"><div class="name">Blue</div><div class="hex">#3A8AE8 / #0D2A4A</div></div></div>
  </div>
  <div class="badges">
    <span class="badge" style="background:#0F3D2A;color:#1DB87A;border-color:#1DB87A33;">Delivered</span>
    <span class="badge" style="background:#3D2D0A;color:#F5A623;border-color:#F5A62333;">Pending</span>
    <span class="badge" style="background:#3D1414;color:#E2514A;border-color:#E2514A33;">Cancelled</span>
    <span class="badge" style="background:#0D2A4A;color:#3A8AE8;border-color:#3A8AE833;">Shipped</span>
    <span class="badge" style="background:#2A2550;color:#7C6AF7;border-color:#7C6AF733;">Processing</span>
    <span class="badge" style="background:#1C1C22;color:#8A8A9E;border-color:#2A2A35;">Regular</span>
  </div>
</body>
</html>
