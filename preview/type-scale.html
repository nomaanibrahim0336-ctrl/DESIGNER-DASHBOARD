<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0F; font-family: 'DM Sans', sans-serif; padding: 20px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid #1F1F28; }
  .row:last-child { border-bottom: none; }
  .meta { min-width: 140px; }
  .role { font-size: 10px; font-weight: 600; color: #55556A; text-transform: uppercase; letter-spacing: 0.08em; }
  .spec { font-size: 10px; color: #55556A; }
</style>
</head>
<body>
  <div class="row"><div class="meta"><div class="role">Page Title / h1</div><div class="spec">20px · 700</div></div><div style="font-size:20px;font-weight:700;color:#F0EFF6;">Dashboard</div></div>
  <div class="row"><div class="meta"><div class="role">Card Heading / h2</div><div class="spec">14px · 600</div></div><div style="font-size:14px;font-weight:600;color:#F0EFF6;">Revenue Last 30 Days</div></div>
  <div class="row"><div class="meta"><div class="role">Body / Default</div><div class="spec">13px · 400</div></div><div style="font-size:13px;color:#F0EFF6;">New order #ORD-7841 from Aisha Malik</div></div>
  <div class="row"><div class="meta"><div class="role">Secondary Label</div><div class="spec">13px secondary</div></div><div style="font-size:13px;color:#8A8A9E;">Welcome back, here's what's happening today</div></div>
  <div class="row"><div class="meta"><div class="role">Section Label</div><div class="spec">10px · 700 CAPS</div></div><div style="font-size:10px;font-weight:700;color:#55556A;letter-spacing:0.08em;text-transform:uppercase;">OVERVIEW</div></div>
  <div class="row"><div class="meta"><div class="role">Stat Value</div><div class="spec">26px · 700</div></div><div style="font-size:26px;font-weight:700;color:#F0EFF6;line-height:1;">1,284</div></div>
</body>
</html>
